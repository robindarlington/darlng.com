server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # NOTE: nginx's add_header does not merge with a parent block's add_header —
    # a location block that declares its own add_header REPLACES all headers
    # inherited from server{}, it does not add to them. The security headers
    # below are therefore repeated verbatim in every location block that also
    # sets its own Cache-Control, so both the cache-control contract and the
    # security headers land on every response class.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location ^~ /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }
}
